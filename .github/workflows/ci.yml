name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      CSRF_SECRET: test-csrf-secret-with-at-least-thirty-two-characters
      DATABASE_URL: postgresql+psycopg://eiheizone_app:test-password@127.0.0.1:5432/eiheizone_test
      TEST_DATABASE_URL: postgresql+psycopg://eiheizone_app:test-password@127.0.0.1:5432/eiheizone_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eiheizone_test
          POSTGRES_USER: eiheizone_app
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eiheizone_app -d eiheizone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install "uv==0.11.23"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: |
          uv run alembic -x database=test upgrade head
          uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  deployment-artifacts:
    name: Deployment artifacts
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment scripts
        run: bash -n deploy.sh rollback.sh

      - name: Validate Compose configuration
        run: |
          cp deploy.env.example .env
          DEPLOY_IMAGE_TAG=ci docker compose config --quiet

      - name: Build production images
        run: DEPLOY_IMAGE_TAG=ci docker compose build backend frontend
